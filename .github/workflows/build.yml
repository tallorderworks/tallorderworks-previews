name: Build previews

on:
  push:
    branches: [main]
    paths:
      - "prospects/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild every prospect"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: previews
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install playwright==1.47.0 pillow requests
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-dejavu-core >/dev/null

      - name: Build
        env:
          FORCE_ALL: ${{ github.event.inputs.force_all == 'true' && '1' || '0' }}
        run: python scripts/build.py

      - name: Save screenshots and images back to the repo
        run: |
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git add prospects
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Build output [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
